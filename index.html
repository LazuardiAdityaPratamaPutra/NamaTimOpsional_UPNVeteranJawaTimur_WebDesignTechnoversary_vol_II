<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="PyraOps: edukasi dan simulasi karhutla. Bukan hanya melihat api, tapi tahu ke mana api akan pergi." />
    <title>PyraOps</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PyraOps: edukasi dan simulasi karhutla" />
    <meta property="og:description" content="Bukan hanya melihat api, tapi tahu ke mana api akan pergi." />
    <meta name="theme-color" content="#09110D" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      // Terapkan tema tersimpan sebelum render agar tidak berkedip
      try {
        var t = localStorage.getItem('pyraops-theme') ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('pyraops-lang');
        if (l === 'en' || l === 'id') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
